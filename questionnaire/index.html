<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessing the Practical Value of Scenario Rules for ADS Testing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 20px;
            padding: 20px;
            padding-bottom: 120px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }

        .test-case {
            background: #ffffff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }

        .information {
            background: #ffffff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .video-row {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .video-container {
            flex: 1;
            box-sizing: border-box;
            text-align: center;
            background: #f0f0f0;
            padding: 5px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 5px;
            border: 2px solid #ddd;
        }

        img {
            display: block;
            margin: 10px auto;
            max-width: 100%;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #007bff;
        }

        h2, h3 {
            color: #0056b3;
            text-align: center;
        }

        h4 {
            color: #0056b3;
        }

        p {
            line-height: 1.5;
            text-align: justify;
        }

        ul {
            padding-left: 20px;
        }

        label {
            display: block;
            margin: 5px 0;
            cursor: pointer;
        }

        button {
            display: block;
            width: 200px;
            margin: 20px auto;
            padding: 10px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .fixed-update-bar {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0px;
        }

        .fixed-update-button {
            min-width: 220px;
            padding: 10px 28px;
            font-size: 24px;
            font-weight: bold;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 14px;
            box-shadow: 0px 8px 18px rgba(0, 0, 0, 0.22);
            cursor: pointer;
        }

        .fixed-update-button:hover {
            background: #0056b3;
        }

        .save-status {
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 14px;
            border-radius: 10px;
            box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.12);
            font-size: 14px;
            color: #333;
            max-width: 280px;
        }
    </style>
</head>
<body>

<h1>🚗 Assessing the Practical Value of Scenario Rules for ADS Testing</h1>

<!-- Explanation Section -->
<div class="container">
    <h2>Understanding the Questionnaire</h2>
    <div class="information" id="infobox">
    </div>
</div>

<!-- Questionnaire Section -->
<div class="container">
    <h2>🚦 Questionnaire</h2>
    <form id="questionnaireForm">
        <div id="testCasesContainer"></div>
        <button type="button" onclick="saveResponses()">💾 Save Responses</button>
    </form>
</div>

<div id="updateBar" class="fixed-update-bar">
    <div id="saveStatus" class="save-status">Ready</div>
    <button id="updateRulesButton" class="fixed-update-button" type="button">UPDATE RULES</button>
</div>

<script src="rules.js"></script>
<script>
    const EDIT_MODE = true;
    const showRule = new URLSearchParams(window.location.search).has("debug");

    const updateButton = document.getElementById("updateBar");
    if (!EDIT_MODE) {
        updateButton.style.display = "none";
    }

    const testCaseFolders = [
        "rs-1771186004494-rs-58d1ad-2",
        "ccea-1772422653593-ccea-d50407-12",
        "gawa-1771807317092-gawa-b8fefe-3",
        "rs-1770606205619-rs-495169-1",
        "ccea-1772306083018-ccea-9ec8ed-3",
        "gawa-1771590353173-gawa-f33e4f-4",
        "ccea-c-1770141244797-ccea-fa1b37-12",
        "gawa-1771657788332-gawa-d09f9c-3",
        "gawa-1771590353173-gawa-f33e4f-1",
        "ccea-c-1770285314059-ccea-4bee83-7",
    ];

    let rulesFileHandle = null;

    function setStatus(message, isError = false) {
        const el = document.getElementById("saveStatus");
        el.textContent = message;
        el.style.color = isError ? "#b00020" : "#333";
    }

    function escapeHtml(text) {
        return String(text)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;");
    }

    function generateTestCases() {
        document.getElementById("infobox").innerHTML = pagecontent;
        if (EDIT_MODE) {
            document.getElementById("infobox").contentEditable = "true";
        }
        const container = document.getElementById("testCasesContainer");
        container.innerHTML = "";

        testCaseFolders.forEach((folder, index) => {
            const rule = rules[index];

            const conditionField = EDIT_MODE
                ? `
                    <div
                        class="editable-html"
                        data-index="${index}"
                        data-field="condition"
                        contenteditable="true"
                    >${escapeHtml(rule.condition)}</div>
                  `
                : `
                    <p>${rule.condition}</p>
                  `;

            const diffField = EDIT_MODE
                ? `
                    <div
                        class="editable-html"
                        data-index="${index}"
                        data-field="diff"
                        contenteditable="true"
                    >${escapeHtml(rule.diff)}</div>
                  `
                : `
                    <p>${rule.diff}</p>
                  `;

            const ruleField = EDIT_MODE
                ? `
                    <h4>Rule and Coefficient:</h4>
                    <p>Rule: ${rule.rule}</p>
                    <p>Coefficient: ${rule.coef}</p>
                ` : null;

            const testCaseHTML = `
                <div class="test-case" id="rule_${index + 1}">
                    <h2>Rule ${index + 1}</h2>

                    <h4>Conditions Under Which the Two ADS Versions Differ:</h4>
                    ${conditionField}
<!--                    <p style="font-size: 11px; color: brown">${rule.rule}</p>-->

                    <h4>Observed Behavioral Discrepancy:</h4>
                    ${diffField}

                    <div style="display: ${showRule ? 'block' : 'none'};">
                        ${ruleField}
                    </div>

                    <h4>Occurrence Frequency:</h4>
                    <p>This rule applies to ${(rule.support * 100).toFixed(2)}% of all detected behavioral discrepancies.</p>

                    <h4>An Example Scenario Where This Rule Applies:</h4>
                    <div class="video-row">
                        <div class="video-container">
                            <h4>Version 1.0</h4>
                            <div class="video-placeholder" data-src="test_cases/${folder}/v1/follow-up/follow-up-fixed.mp4"></div>
                        </div>

                        <div class="video-container">
                            <h4>Version 2.0</h4>
                            <div class="video-placeholder" data-src="test_cases/${folder}/v2/follow-up/follow-up-fixed.mp4"></div>
                        </div>
                    </div>

                    <!-- Question 1 -->
                    <h4>1. How easy is it to understand the conditions described by this rule?</h4>
                    <label><input type="radio" name="q1_${index + 1}" value="1"> Very difficult to understand</label>
                    <label><input type="radio" name="q1_${index + 1}" value="2"> Difficult</label>
                    <label><input type="radio" name="q1_${index + 1}" value="3"> Moderately easy</label>
                    <label><input type="radio" name="q1_${index + 1}" value="4"> Easy</label>
                    <label><input type="radio" name="q1_${index + 1}" value="5"> Very easy to understand</label>


                    <!-- Question 2 -->
                    <h4>2. Does this rule help you narrow down which types of conditions to prioritize for testing the updated system?</h4>
                    <label><input type="radio" name="q2_${index + 1}" value="1"> Not at all</label>
                    <label><input type="radio" name="q2_${index + 1}" value="2"> Slightly</label>
                    <label><input type="radio" name="q2_${index + 1}" value="3"> Moderately</label>
                    <label><input type="radio" name="q2_${index + 1}" value="4"> Considerably</label>
                    <label><input type="radio" name="q2_${index + 1}" value="5"> Very much</label>

                    <!-- Question 3 -->
                    <!-- <h4>3. Does this rule point you toward a specific area of the system to investigate further (e.g., perception in low light, planning near pedestrians, interaction with oncoming traffic)?</h4>
                    <label><input type="radio" name="q3_${index + 1}" value="1"> No clear direction</label>
                    <label><input type="radio" name="q3_${index + 1}" value="2"> Vague direction</label>
                    <label><input type="radio" name="q3_${index + 1}" value="3"> Some direction</label>
                    <label><input type="radio" name="q3_${index + 1}" value="4"> Clear direction</label>
                    <label><input type="radio" name="q3_${index + 1}" value="5"> Very specific direction</label> -->

                    <!-- Question 4 -->
                    <!-- <h4>4. Does this rule reveal a condition that you would not have thought to test on your own?</h4>
                    <label><input type="radio" name="q4_${index + 1}" value="1"> Entirely obvious</label>
                    <label><input type="radio" name="q4_${index + 1}" value="2"> Mostly obvious</label>
                    <label><input type="radio" name="q4_${index + 1}" value="3"> Somewhat novel</label>
                    <label><input type="radio" name="q4_${index + 1}" value="4"> Notably novel</label>
                    <label><input type="radio" name="q4_${index + 1}" value="5"> Highly surprising</label> -->
                </div>
            `;
            container.innerHTML += testCaseHTML;
        });

        setupEditors();
        setupLazyLoading();
    }

    function setupEditors() {
        if (!EDIT_MODE) return;

        document.querySelectorAll(".editable-html").forEach(editor => {
            editor.addEventListener("input", (event) => {
                const index = Number(event.target.dataset.index);
                const field = event.target.dataset.field;

                // Save edited text back into the rules array
                rules[index][field] = event.target.textContent.trim();

                setStatus("Unsaved changes");
            });
        });
    }

    function setupLazyLoading() {
        document.querySelectorAll(".video-placeholder").forEach(placeholder => {
            let videoSrc = placeholder.getAttribute("data-src");
            let videoElement = document.createElement("video");
            videoElement.setAttribute("controls", "");
            videoElement.style.width = "100%";
            videoElement.innerHTML = `<source src="${videoSrc}" type="video/mp4">`;
            placeholder.replaceWith(videoElement);
        });
    }

    async function pickRulesFileIfNeeded() {
        if (rulesFileHandle) return rulesFileHandle;

        if (!window.showOpenFilePicker) {
            throw new Error("This browser does not support direct file writing. Use Chrome or Edge.");
        }

        const [handle] = await window.showOpenFilePicker({
            multiple: false,
            types: [
                {
                    description: "JavaScript files",
                    accept: {"application/javascript": [".js"]}
                }
            ]
        });

        rulesFileHandle = handle;
        return handle;
    }

    async function updateRulesFile() {
        try {
            setStatus("Opening file...");

            const handle = await pickRulesFileIfNeeded();

            setStatus("Collecting edited content...");

            const infobox = document.getElementById("infobox");
            let updatedPageContent = pagecontent;

            if (infobox) {
                updatedPageContent = infobox.innerHTML;
            }

            setStatus("Writing to rules.js...");

            const escapedPageContent = updatedPageContent
                .trim()
                .replaceAll("\\", "\\\\")
                .replaceAll("`", "\\`")
                .replaceAll("${", "\\${");

            const fileContent =
                "const pagecontent = `\n" + escapedPageContent + "\n`;\n\n" +
                "const rules = " + JSON.stringify(rules, null, 4) + ";\n\n";

            const writable = await handle.createWritable();
            await writable.write(fileContent);
            await writable.close();

            setStatus("rules.js updated");
        } catch (error) {
            console.error(error);
            setStatus("Update failed: " + error.message, true);
        }
    }

    document.getElementById("updateRulesButton").addEventListener("click", updateRulesFile);

    function saveResponses() {
        let responses = [["Rule Index", "Rule Name", "Q1", "Q2", "Q3"]];

        testCaseFolders.forEach((folder, index) => {
            let q1 = document.querySelector(`input[name="q1_${index + 1}"]:checked`);
            let q2 = document.querySelector(`input[name="q2_${index + 1}"]:checked`);
            let q3 = document.querySelector(`input[name="q3_${index + 1}"]:checked`);
            // let q4 = document.querySelector(`input[name="q4_${index + 1}"]:checked`);

            let q1Value = q1 ? q1.value : "Not Answered";
            let q2Value = q2 ? q2.value : "Not Answered";
            let q3Value = q3 ? q3.value : "Not Answered";
            // let q4Value = q4 ? q4.value : "Not Answered";

            responses.push([`Test Case ${index + 1}`, folder, q1Value, q2Value, q3Value]);
        });

        let csvContent = responses.map(e => e.join(",")).join("\n");

        let blob = new Blob([csvContent], {type: "text/csv"});
        let link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "test_case_responses.csv";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    window.onload = generateTestCases;
</script>
</body>
</html>
