workspace: out
log: logs
checkpoint: checkpoints
solution: solutions
visualization: visualizations
debug: false

simulation:
  root: "../InterFuser"
  parallel: true
  result: results
  save: results/eval
  retry_times: 1
  display_agent: false
  timeout: 20
  client_timeout: 10
  wait_for_world: 20
  frame_rate: 10
  high_graphics: true
  docker:
    enabled: true
    image: carla-0.9.10
    instances:
      - host: localhost
        port: 2000
        tm_port: 2500
        gpu_device: 0
        memory: 8g
        cpu: 4
      - host: localhost
        port: 2002
        tm_port: 2502
        gpu_device: 1
        memory: 8g
        cpu: 4

max_sim: 1000
max_time: 3600
max_iter: 20

scenario:
  pop_size: 10
  init_selection_factor: 1
  tournament: 3
  cxpb: 0.8
  eta: 10.0
  mutpb: 0.9

perturbation:
  pop_size: 10
  tournament: 3
  cxpb: 0.8
  mutpb: 0.5
  mut_add: 0.6
  mut_del: 0.2

convergence_threshold: 0.9
archive_size: 3
diversity_opt: true
punishment: 1.0
scaling: 1.0
dist_scaling: 0.4

boundary:
  vehicle:
    x: [ -300.0, 300.0 ]
    y: [ -300.0, 300.0 ]
    z: [ 0.5, 5.0 ]
    pitch: [ -45.0, 45.0 ]
    yaw: [ -180.0, 180.0 ]
    roll: [ -45.0, 45.0 ]
    speed: [ 0.0, 100.0 ]
    model: [ 0, 26 ]
    color: [ 0, 2 ]
    autopilot: [ 0, 1 ]
  walker:
    x: [ -300.0, 300.0 ]
    y: [ -300.0, 300.0 ]
    z: [ 0.5, 5.0 ]
    pitch: [ -45.0, 45.0 ]
    yaw: [ -180.0, 180.0 ]
    roll: [ -45.0, 45.0 ]
    speed: [ 0.0, 10.0 ]
    model: [ 0, 14 ]
  static:
    x: [ -300.0, 300.0 ]
    y: [ -300.0, 300.0 ]
    z: [ 0.5, 5.0 ]
    pitch: [ -45.0, 45.0 ]
    yaw: [ -180.0, 180.0 ]
    roll: [ -45.0, 45.0 ]
    model: [ 0, 89 ]
    size: [ 0.0, 100.0 ]
  env:
    weather: [ 0, 13 ]

